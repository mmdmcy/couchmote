[package]
name = "couchmote"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight YouTube couch remote for a Linux TV box"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmdmcy/couchmote"
homepage = "https://github.com/mmdmcy/couchmote"
keywords = ["youtube", "remote-control", "firefox", "tailscale", "linux"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
if-addrs = "0.15"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
